<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sempre Atualizado</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <div class="wrap hero-in">
    <div class="hero-txt">
      <h1>🧠 Sempre Atualizado</h1>
      <div class="sub" id="subtitle">Radar de aprendizado — assuntos novos por tema, todo dia</div>
    </div>
    <div class="stats" id="stats">
      <span class="st novos"><b id="s-novos">0</b><i>novos</i></span>
      <span class="st sel"><b id="s-sel">0</b><i>selecionados</i></span>
      <span class="st tot"><b id="s-tot">0</b><i>no banco</i></span>
      <span class="st upd" id="s-upd"></span>
    </div>
  </div>
</header>

<nav class="toolbar">
  <div class="wrap tb-in">
    <input id="busca" class="busca" type="search" placeholder="🔎 buscar assunto…" autocomplete="off">
    <div class="chips" id="chips">
      <button class="chip on" data-f="novos">✨ Novos</button>
      <button class="chip" data-f="sel">✅ Selecionados</button>
      <button class="chip" data-f="todos">📋 Todos</button>
      <button class="chip" data-f="lidos">📁 Arquivados</button>
      <span class="chip-sep"></span>
      <button class="chip" data-g="all" data-on="1">Tudo</button>
      <button class="chip" data-g="negocios">🏢 Negócios</button>
      <button class="chip" data-g="pessoal">🌱 Pessoal</button>
    </div>
  </div>
</nav>

<div class="layout">
  <aside id="side" class="side">
    <div class="side-head"><span>📑 Categorias</span><button id="side-close" title="Fechar">✕</button></div>
    <div id="sidelist" class="sidelist"></div>
  </aside>

  <main class="feedcol">
    <div id="feed" class="feed"><div class="loading">Carregando o radar…</div></div>
  </main>
</div>

<button id="side-toggle" class="side-toggle">📑 Categorias</button>
<div id="side-backdrop" class="side-backdrop"></div>

<!-- barra flutuante de acao -->
<div class="actionbar" id="actionbar">
  <div class="wrap ab-in">
    <span class="ab-count" id="ab-count">0 selecionados</span>
    <div class="ab-btns">
      <button id="btn-links" class="btn-links">🔗 Links pro NotebookLM</button>
      <button id="btn-gerar" class="btn-gerar">🧠 Gerar texto</button>
    </div>
  </div>
</div>

<!-- modal -->
<div class="modal" id="modal">
  <div class="modal-card">
    <div class="modal-head">
      <b id="modal-title">🔗 Links pro NotebookLM</b>
      <button id="modal-close" title="Fechar">✕</button>
    </div>
    <div class="modal-tabs">
      <button class="mtab on" data-m="links">🔗 Links (NotebookLM)</button>
      <button class="mtab" data-m="texto">📄 Texto em capítulos</button>
    </div>
    <p class="modal-hint" id="modal-hint"></p>
    <textarea id="modal-txt" readonly></textarea>
    <div class="modal-actions">
      <button id="btn-copiar" class="btn-copiar">📋 Copiar</button>
      <button id="btn-arquivar" class="btn-arquivar">📁 Marcar selecionados como lidos</button>
      <span class="modal-saved" id="modal-saved"></span>
    </div>
  </div>
</div>

<footer class="foot">
  <div class="wrap">Sempre Atualizado · pessoal do Bruno · o que você marca fica salvo.</div>
</footer>

<div id="toast" class="toast"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
